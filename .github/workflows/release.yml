name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test.yml
    with:
      install_script_changed: false
    permissions:
      contents: read
      packages: read

  release:
    name: GoReleaser
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: read
      attestations: write # publish Sigstore build-provenance attestations for release artifacts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/bootstrap

      - name: Fetch release secrets
        uses: ./.github/actions/fetch-release-secrets
        with:
          role-to-assume: ${{ secrets.RELEASE_ROLE_ARN }}

      - name: Decode Homebrew tap app private key
        shell: bash
        run: |
          set -euo pipefail
          decoded=$(printf '%s' "$HOMEBREW_TAP_APP_PRIVATE_KEY_B64" | base64 --decode)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$decoded"
          {
            echo "HOMEBREW_TAP_APP_PRIVATE_KEY<<EOF_HOMEBREW_TAP_APP_PRIVATE_KEY"
            echo "$decoded"
            echo "EOF_HOMEBREW_TAP_APP_PRIVATE_KEY"
          } >> "$GITHUB_ENV"

      - name: Mint Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ env.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: contextbridge
          repositories: homebrew-tap
          permission-contents: write

      - name: Validate telemetry build config
        shell: bash
        run: |
          set -euo pipefail
          for name in __CB_POSTHOG_KEY__ __CB_POSTHOG_HOST__ __CB_SENTRY_CLI_DSN__ __CB_SENTRY_FRONTEND_DSN__; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is required for release builds" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          done

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # Build provenance: a Sigstore-signed attestation binding every release
      # archive (each file in checksums.txt) to this repo, commit, and workflow
      # run, recorded in a public transparency log. Attestations are keyed by
      # artifact digest, so they also cover the byte-identical copies served from
      # downloads.contextbridge.ai and the Homebrew cask. Verify a download with:
      #   gh attestation verify <archive> --repo contextbridge/planbridge
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-checksums: dist/checksums.txt

      - name: Mirror release to channel alias
        shell: bash
        env:
          BUCKET: ${{ env.DOWNLOADS_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.DOWNLOADS_DISTRIBUTION_ID }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION_NO_V="${VERSION_TAG#v}"
          # Tag shape decides which alias moves: prerelease tags carry a `-`
          # (e.g. v0.2.0-alpha.1), stable tags don't. Mirrors the
          # `skip_upload: auto` semantics in .goreleaser.yaml's homebrew_casks.
          case "$VERSION_TAG" in
            *-*) ALIAS="latest-alpha" ;;
            *)   ALIAS="latest" ;;
          esac
          SRC="cli/${VERSION_NO_V}"
          DST="cli/${ALIAS}"

          echo "==> mirroring s3://${BUCKET}/${SRC}/ to s3://${BUCKET}/${DST}/"
          for os in darwin linux; do
            for arch in arm64 amd64; do
              SRC_FILE="contextbridge_${VERSION_NO_V}_${os}_${arch}.tar.gz"
              DST_FILE="contextbridge_${ALIAS}_${os}_${arch}.tar.gz"
              echo "    ${SRC_FILE} -> ${DST_FILE}"
              aws s3 cp \
                "s3://${BUCKET}/${SRC}/${SRC_FILE}" \
                "s3://${BUCKET}/${DST}/${DST_FILE}" \
                --region us-east-1
            done
          done

          # Rewrite checksums.txt so its embedded filenames match the mirrored
          # objects (otherwise install.sh's verify_checksum can't find the line).
          echo "==> rewriting checksums.txt"
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          aws s3 cp "s3://${BUCKET}/${SRC}/checksums.txt" "$tmp/checksums.txt" --region us-east-1
          sed "s/_${VERSION_NO_V}_/_${ALIAS}_/g" "$tmp/checksums.txt" > "$tmp/checksums-aliased.txt"
          aws s3 cp "$tmp/checksums-aliased.txt" "s3://${BUCKET}/${DST}/checksums.txt" --region us-east-1

          # CloudFront's 1-day min TTL would otherwise serve the previous alias
          # target after the swap. Versioned paths (cli/${VERSION}/) are
          # immutable and never need invalidation.
          echo "==> invalidating /cli/${ALIAS}/*"
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/cli/${ALIAS}/*" \
            --region us-east-1

      - name: Publish install.sh to CloudFront
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp scripts/install.sh "s3://${DOWNLOADS_BUCKET}/cli/install.sh" \
            --region us-east-1 \
            --content-type 'text/x-shellscript; charset=utf-8' \
            --cache-control 'public, max-age=300'

  deploy-website:
    name: Deploy website
    needs: release
    # Skip alpha releases so unreleased docs do not publish before stable CLI releases.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/deploy-website.yml
    with:
      cli_ref: ${{ github.ref_name }}
    secrets:
      website_deploy_role_arn: ${{ secrets.WEBSITE_DEPLOY_ROLE_ARN }}
      website_bucket: ${{ secrets.WEBSITE_BUCKET }}
      website_distribution_id: ${{ secrets.WEBSITE_DISTRIBUTION_ID }}
    permissions:
      contents: read
      id-token: write
      packages: read

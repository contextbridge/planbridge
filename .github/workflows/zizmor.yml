name: zizmor

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # zizmor reads workflow run metadata for online audits
      id-token: write # OIDC for AWS role assumption (App credentials live in SSM)
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.RELEASE_ROLE_ARN }}
          aws-region: us-west-2

      - name: Fetch automation App credentials from SSM
        shell: bash
        env:
          PARAM_PATH: /cb-cli/ci/release/env-vars
        run: |
          set -euo pipefail
          for name in CB_PR_AUTOMATION_APP_ID CB_PR_AUTOMATION_APP_PRIVATE_KEY; do
            value=$(aws ssm get-parameter \
              --name "${PARAM_PATH}/${name}" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text)
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<< "$value"
            {
              echo "${name}<<EOF_${name}"
              echo "$value"
              echo "EOF_${name}"
            } >> "$GITHUB_ENV"
          done

      - name: Generate ContextBridge app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ env.CB_PR_AUTOMATION_APP_ID }}
          private-key: ${{ env.CB_PR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: contextbridge
          repositories: |
            planbridge
            contextbot-actions

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Run zizmor
        run: uvx zizmor --format=sarif .github/ > zizmor.sarif
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload zizmor SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          if-no-files-found: ignore

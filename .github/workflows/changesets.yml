name: Create Release PR

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changesets:
    name: changesets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate ContextBridge app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CB_PR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.CB_PR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: contextbridge
          repositories: planbridge
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/bootstrap

      - uses: changesets/action@d94a5c301145045a0960133674e003b265942a22 # v1.8.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version: bun run version
          # Native Changesets GitHub releases use package@version tags in workspaces.
          # The CLI release workflow listens for v* tags, so this publish command
          # creates the existing vX.Y.Z GitHub release from the Changesets changelog.
          publish: bun run release:github
          createGithubReleases: false
          commitMode: github-api
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

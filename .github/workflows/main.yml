name: Main Branch

on:
  push:
    branches: [main]

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      dependencies_changed: ${{ steps.changes.outputs.dependencies_changed }}
      install_script_changed: ${{ steps.changes.outputs.install_script_changed }}
      website_changed: ${{ steps.changes.outputs.website_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          mode: deploy
          workflow_name: Main Branch
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests
    needs: detect-changes
    uses: ./.github/workflows/test.yml
    with:
      install_script_changed: ${{ needs.detect-changes.outputs.install_script_changed == 'true' }}
    permissions:
      contents: read
      packages: read

  deploy-website:
    name: Deploy website
    needs: [detect-changes, test]
    if: ${{ needs.detect-changes.outputs.website_changed == 'true' }}
    uses: ./.github/workflows/deploy-website.yml
    secrets:
      website_deploy_role_arn: ${{ secrets.WEBSITE_DEPLOY_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write
      packages: read
